<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<style>
body{font:500 18px/1.4 sans-serif;background:#FFB68F;padding:16px}
main{max-width:420px;margin:40px auto;background:#FFF6E8;border:4px solid #000;border-radius:22px;box-shadow:6px 6px 0 #000;padding:18px}
input{width:100%;font:inherit;padding:12px;border:3px solid #000;border-radius:14px;box-sizing:border-box;margin:8px 0}
button{width:100%;font:inherit;font-weight:700;padding:14px;color:#fff;background:#D62828;border:4px solid #000;border-radius:16px;cursor:pointer}
#am{margin-top:14px;font-weight:700}
</style>
</head>
<body>
<main>
  <h2>Admin</h2>
  <input id="ak" type="password" autocomplete="off" placeholder="Admin key">
  <button id="draw">Run the draw (once only)</button>
  <div id="am"></div>
</main>
<script>
document.getElementById("draw").onclick = async () => {
  const m = document.getElementById("am");
  if (!confirm("Run the draw now? This can only be done once.")) return;
  m.textContent = "Drawing...";
  try {
    const r = await fetch("/api/draw", { method: "POST", headers: { "x-admin-key": document.getElementById("ak").value } });
    const d = await r.json();
    m.textContent = r.ok ? "Done! " + d.picked + " winners picked." : (d.error || "Failed.");
  } catch { m.textContent = "No connection."; }
};
</script>
</body>
</html>
