<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Whitelist: 100 spots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--peach:#FFB68F;--ink:#000;--navy:#232844;--yellow:#FFD93B;--red:#D62828;--green:#7BD389;--paper:#FFF6E8}
*{box-sizing:border-box}
body{margin:0;background:var(--peach);color:var(--ink);font:500 18px/1.4 Fredoka,"Comic Sans MS",sans-serif;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(32px,env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto}
h1,h2{font-family:"Luckiest Guy",Impact,sans-serif;font-weight:400;letter-spacing:.5px;margin:0}
.box{background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);padding:18px;margin-bottom:22px}
.hero{padding:0;overflow:hidden;background:var(--peach)}
.hero img{display:block;width:100%}
.title{display:flex;align-items:center;gap:12px;margin:6px 0 22px}
.title img{width:84px;height:84px;border:4px solid var(--ink);border-radius:50%;box-shadow:4px 4px 0 var(--ink);background:var(--peach);flex:none}
.title h1{font-size:40px;line-height:1;color:var(--paper);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);paint-order:stroke fill}
.tabs{display:flex;gap:10px;margin-bottom:22px}
.tab{flex:1;font:inherit;font-family:"Luckiest Guy",Impact,sans-serif;font-size:20px;padding:12px 6px;background:var(--paper);border:4px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.tab[aria-selected=true]{background:var(--yellow);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
label{display:block;font-weight:700;margin:12px 0 6px}
input{width:100%;font:inherit;padding:12px 14px;background:#fff;border:3px solid var(--ink);border-radius:14px}
input:focus-visible,button:focus-visible{outline:4px solid var(--navy);outline-offset:2px}
.go{width:100%;margin-top:18px;font-family:"Luckiest Guy",Impact,sans-serif;font-size:24px;padding:14px;color:var(--paper);background:var(--red);border:4px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);cursor:pointer}
.go:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.go:disabled{opacity:.6}
.msg{margin-top:16px;font-weight:700}
.msg.err{color:var(--red)}
.hidden{display:none}
.result{text-align:center}
.result h2{font-size:34px;margin:10px 0 4px}
.result video{width:100%;max-height:340px;object-fit:cover;border:4px solid var(--ink);border-radius:16px;background:var(--navy)}
.yes h2{color:#1d8a39}.no h2{color:var(--red)}
@media (prefers-reduced-motion:no-preference){.title img{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:rotate(-6deg) translateY(-3px)}}}
</style>
</head>
<body>
<main>

<!-- ASSET FILES: upload these into the "public" folder with exactly these names -->
<!-- banner: 50FC8DE9-B17B-4647-B83D-D3A576BB07F2.png | avatar: IMG_0189.png -->
<!-- eligible video: Cat_front_.mov | not eligible video: Trauma_soilder_.mov -->

<div class="box hero"><img src="50FC8DE9-B17B-4647-B83D-D3A576BB07F2.png" alt="Who is HE?"></div>

<div class="title">
  <img src="IMG_0189.png" alt="">
  <h1>100 spots up for grabs!</h1>
</div>

<div class="tabs" role="tablist">
  <button class="tab" id="t-join" role="tab" aria-selected="true">Join</button>
  <button class="tab" id="t-check" role="tab" aria-selected="false">Am I in?</button>
</div>

<section class="box" id="join">
  <h2>Get in the pool</h2>
  <p>Drop your username and wallet. 100 random winners get whitelisted. One entry each, no cheating.</p>
  <label for="u">Username</label>
  <input id="u" autocomplete="off" maxlength="30" placeholder="your_name">
  <label for="w">Wallet address</label>
  <input id="w" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="0x...">
  <button class="go" id="enter">Enter the draw</button>
  <div class="msg" id="jm" role="status"></div>
</section>

<section class="box hidden" id="check">
  <h2>Check your wallet</h2>
  <p>Paste your wallet to see if you made the list.</p>
  <label for="cw">Wallet address</label>
  <input id="cw" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="0x...">
  <button class="go" id="chk">Check</button>
  <div class="msg" id="cm" role="status"></div>
  <div class="result hidden" id="res">
    <video id="vid" autoplay loop muted playsinline></video>
    <h2 id="rt"></h2>
    <div id="rs"></div>
  </div>
</section>


</main>
<script>
const $ = (id) => document.getElementById(id);
const VIDEO_YES = "Cat_front_.mov";
const VIDEO_NO = "Trauma_soilder_.mov";

function tab(which) {
  const join = which === "join";
  $("join").classList.toggle("hidden", !join);
  $("check").classList.toggle("hidden", join);
  $("t-join").setAttribute("aria-selected", join);
  $("t-check").setAttribute("aria-selected", !join);
}
$("t-join").onclick = () => tab("join");
$("t-check").onclick = () => tab("check");

function say(el, text, bad) { el.textContent = text; el.className = "msg" + (bad ? " err" : ""); }

$("enter").onclick = async () => {
  const b = $("enter"), m = $("jm");
  b.disabled = true; say(m, "Sending...");
  try {
    const r = await fetch("/api/enter", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("u").value, wallet: $("w").value }),
    });
    const d = await r.json();
    if (r.ok) { say(m, "You're in the pool! Come back later and check your wallet."); $("u").value = ""; $("w").value = ""; }
    else say(m, d.error || "Something broke. Try again.", true);
  } catch { say(m, "No connection. Try again.", true); }
  b.disabled = false;
};

$("chk").onclick = async () => {
  const b = $("chk"), m = $("cm"), res = $("res"), v = $("vid");
  b.disabled = true; res.classList.add("hidden"); say(m, "Checking...");
  try {
    const r = await fetch("/api/check?wallet=" + encodeURIComponent($("cw").value.trim()));
    const d = await r.json();
    if (!r.ok) { say(m, d.error || "Something broke. Try again.", true); }
    else if (d.status === "pending") { say(m, "The draw hasn't happened yet. Check back soon!"); }
    else {
      const yes = d.status === "eligible";
      say(m, "");
      res.className = "result " + (yes ? "yes" : "no");
      $("rt").textContent = yes ? "YOU'RE ELIGIBLE!" : "Not eligible";
      $("rs").textContent = yes ? "Welcome to the whitelist." : "Not this time. Thanks for entering!";
      v.src = yes ? VIDEO_YES : VIDEO_NO;
      v.play().catch(() => {});
    }
  } catch { say(m, "No connection. Try again.", true); }
  b.disabled = false;
};
</script>
</body>
</html>
